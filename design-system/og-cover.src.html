<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ChiroPro — Open Graph cover source (1200×630)</title>
<!-- BUILD SOURCE, not a site page. Rendered to assets/og-cover.jpg at exactly
     1200×630 by design-system/render-og.mjs. It pulls the real tokens and the
     real hero photograph so the social card cannot drift from the site. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="tokens.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: var(--ds-font-body);
    background: var(--ds-primary-deep);
    color: var(--ds-ink-on-dark);
    position: relative;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 64px 72px;
  }
  .bg { position: absolute; inset: 0; z-index: 0; overflow: hidden; }
  .bg img { width: 100%; height: 100%; object-fit: cover; object-position: 62% center; }
  /* Same scrim recipe as .hero-bg::after, angled left-to-right so the copy side
     stays legible while the photograph still reads on the right. */
  .bg::after {
    content: ""; position: absolute; inset: 0;
    background:
      linear-gradient(90deg, var(--ds-primary-deep) 30%, rgba(36,56,75,0.82) 62%, rgba(36,56,75,0.62) 100%),
      linear-gradient(180deg, rgba(36,56,75,0.35) 0%, rgba(36,56,75,0.55) 100%);
  }
  .row { position: relative; z-index: 1; }

  .brand { display: flex; align-items: center; gap: 14px; }
  .brand svg { width: 40px; height: 45px; display: block; }
  .brand-word {
    font-family: var(--ds-font-display); font-size: 34px; font-weight: 600;
    letter-spacing: -0.01em; color: var(--ds-ink-on-dark);
  }
  .brand-word em { font-style: normal; color: var(--ds-accent); }

  .eyebrow {
    font-family: var(--ds-font-mono); font-size: 15px; font-weight: 500;
    letter-spacing: 0.24em; text-transform: uppercase; color: var(--ds-accent);
    margin-bottom: 22px;
  }
  h1 {
    font-family: var(--ds-font-display); font-weight: 600;
    font-size: 76px; line-height: 1.04; letter-spacing: -0.02em;
    max-width: 17ch;
  }
  h1 .accent { color: var(--ds-accent); }
  .sub {
    margin-top: 24px; max-width: 46ch;
    font-size: 22px; line-height: 1.5; color: rgba(251,247,241,0.84);
  }

  .trust {
    display: flex; gap: 34px; align-items: center;
    padding-top: 24px; border-top: 1px solid rgba(251,247,241,0.18);
    font-family: var(--ds-font-mono); font-size: 15px; letter-spacing: 0.05em;
    color: rgba(251,247,241,0.8);
  }
  .trust .star { color: var(--ds-accent); }
</style>
</head>
<body>

<div class="bg"><img src="../assets/hero-clinic.jpg" alt=""></div>

<div class="row brand">
  <svg viewBox="0 0 30 34" fill="none" aria-hidden="true">
    <path d="M15 2c4 0 6 2.2 6 4.4s-2.4 3-6 3-6-.8-6-3S11 2 15 2Z" fill="#FBF7F1"/>
    <path d="M15 11c4.4 0 6.6 2.2 6.6 4.3s-2.6 3-6.6 3-6.6-.9-6.6-3S10.6 11 15 11Z" fill="#FBF7F1" opacity=".86"/>
    <path d="M15 20c4.4 0 6.6 2.1 6.6 4.2s-2.6 3-6.6 3-6.6-.9-6.6-3S10.6 20 15 20Z" fill="#FBF7F1" opacity=".7"/>
    <path d="M15 28.6c3 0 4.6 1.4 4.6 2.6S17.6 33 15 33s-4.6-.6-4.6-1.8 1.6-2.6 4.6-2.6Z" fill="#C2A878"/>
  </svg>
  <span class="brand-word">Chiro<em>Pro</em></span>
</div>

<div class="row">
  <p class="eyebrow">Back &middot; Neck &middot; Sciatica &middot; Headaches</p>
  <h1>Never seen a chiropractor?<br><span class="accent">Start here.</span></h1>
  <p class="sub">Assessment, findings and a written plan with a visit count &mdash; on your first appointment.</p>
</div>

<div class="row trust">
  <span><span class="star">&#9733;</span> 4.9 &middot; 1,284 reviews</span>
  <span>3 locations</span>
  <span>Evenings &amp; Saturdays</span>
</div>

</body>
</html>
